[plugin]

name="dot-friends"
description="The player's friends list and presence, integrated with the TMC backbone: who is online, in which game, on which server and in which party, and whether they can be joined. A client that polls the list, posts its own presence on a heartbeat and on every change, diffs snapshots into events, and joins a friend through their party or their server by duck-typed callables. Plus the site's friend and presence rules in-process for a LAN, an offline build and the suite. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_friends_plugin.gd"
